
name: Build AERO TIPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build AERO
        run: |
          xcodebuild \
            -project AERO.xcodeproj \
            -scheme AERO \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package TIPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AERO.app Payload/
          cd Payload
          zip -r ../AERO.tipa AERO.app
          cd ..

      - name: Upload AERO TIPA
        uses: actions/upload-artifact@v4
        with:
          name: AERO-TIPA
          path: AERO.tipa
